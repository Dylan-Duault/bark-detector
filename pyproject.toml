[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bark-detector"
version = "2.0.0"
description = "Local dog vocalisation journal for Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
detector = ["numpy", "sounddevice", "soundfile", "tensorflow>=2.16", "tensorflow-hub", "setuptools<81"]
dev = ["httpx>=0.27,<1"]
browser = ["websocket-client>=1.8,<2"]

[project.scripts]
bark = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*.html", "static/**/*.js", "static/**/*.css", "assets/*.csv", "migrations/*.py", "migrations/versions/*.py", "migrations/*.mako"]
