<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>À l’écoute · Logs en direct</title><link rel="stylesheet" href="/style.css"><script src="/logs.js" defer></script></head>
<body><header><a class="brand" href="/">À l’écoute<span>LE JOURNAL DE VOTRE CHIEN</span></a><a href="/">Retour au dashboard</a></header>
<main><p class="eyebrow">SUIVI DU SYSTÈME</p><h1>Logs en direct</h1>
<p>Les 200 dernières lignes du service choisi, actualisées toutes les 2 secondes.</p>
<div class="log-controls"><label for="source">Service<select id="source"><option value="detector">Détecteur et musique</option><option value="dashboard">Dashboard</option></select></label>
<button id="pause" type="button" aria-pressed="false">Mettre en pause</button><button id="refresh" type="button">Actualiser</button>
<label><input id="follow" type="checkbox" checked> Suivre les nouvelles lignes</label></div>
<p id="log-status" role="status" class="muted">Chargement…</p>
<pre id="log-output" class="log-output" tabindex="0" aria-label="Journal du service"></pre></main></body></html>
