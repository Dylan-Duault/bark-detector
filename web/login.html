<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153e35"><title>Connexion · À l’écoute</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body><header><a class="brand" href="/">À l’écoute<span>LE JOURNAL DE VOTRE CHIEN</span></a></header><main class="login-main"><section class="panel login-panel"><p class="eyebrow">VOTRE ESPACE PRIVÉ</p><h1>Bienvenue à la maison.</h1><p class="muted">Saisissez votre code pour consulter le journal et écouter les enregistrements.</p><form id="login-form"><label for="pin">Code à 4 chiffres</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required autofocus><button id="login-button" type="submit">Accéder au journal</button><p id="login-message" role="status" aria-live="polite"></p></form></section></main></body></html>
